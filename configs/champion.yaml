# Champion config – tuned for 24 GB+ GPUs (RTX 3090/4090/A5000).
# For 16 GB GPUs, use this but set batch_size=1, clip_batch_size=1.
#
# Changes vs default:
#   * larger coreset (32k)
#   * more nearest neighbours (9)
#   * bigger Gaussian smoothing kernel/sigma for cleaner masks
#   * TTA flip weight 0.6
#   * CLIP ensemble weight bumped to 0.3 for better image-level ranking
#   * micro-batch CLIP forward to avoid activation spikes

dinov2_model: "vitl14"
dinov2_layers: [8, 9, 10, 11]
input_size: 448

use_clip: true
clip_model: "ViT-L-14-336"
clip_pretrained: "openai"

coreset_ratio: 0.03
coreset_max: 32768
neighbourhood_size: 3
n_neighbours: 9
smooth_kernel: 11
smooth_sigma: 4.5
cls_bank_weight: 0.25

mv_aggregate: "robust_mean"
mv_vote_beta: 2.0
use_mv_attn: true

use_tta: true
tta_weight_orig: 1.0
tta_weight_flip: 0.6

ens_dino_weight: 0.7
ens_clip_weight: 0.3

batch_size: 2
clip_batch_size: 1
num_workers: 8
use_amp: true
device: "cuda"
seed: 42
