# Champion config (v3 -- bug-fixed). Best-effort P-AP with I-AUROC preserved.
# ===========================================================================
# Try this only AFTER confirming paplus2fix works (I-AUROC>=0.88, P-AP>=0.34).
# If paplus2fix I-AUROC is back to 0.88+ but P-AP <0.35, run this; it pushes
# coreset size to 32k and enables a conservative foreground mask.
#
# Expected peak GPU memory: ~3.8 GB per GPU (banks_on_gpu=false lazy swap).

train_root: "CSIG/Train"
test_root:  "CSIG/Test_A"
out_dir:    "submission_champion"

dinov2_model: "vitl14"
dinov2_layers: [8, 9, 10, 11]
input_size: 448

use_clip: true
clip_model: "ViT-L-14-336"
clip_pretrained: "openai"
clip_mask_ens: false

coreset_ratio: 0.04
coreset_max: 32768
neighbourhood_size: 1
n_neighbours: 1
smooth_kernel: 5
smooth_sigma: 1.5
cls_bank_weight: 0.15
coreset_batch: 64
coreset_presample_ratio: 3.0
random_proj_dim: 256

hard_negative_k: 0      # enable to 512 only after confirming safe

use_foreground_mask: true
fg_percentile: 30.0
fg_bg_floor: 0.20
fg_smooth_sigma: 2.5

cc_min_area: 25
cc_threshold: 0.30
cc_kill_factor: 0.10

mv_aggregate: "robust_mean"
mv_vote_beta: 1.5
use_mv_attn: false
mv_mask_vote: "none"

use_tta: true
tta_weight_orig: 1.0
tta_weight_flip: 0.5

ens_dino_weight: 1.0
ens_clip_weight: 0.20

dino_map_lo_q: 0.65
dino_map_hi_q: 0.998
dino_img_lo_q: 0.05
dino_img_hi_q: 0.95

mask_gamma: 2.0

batch_size: 2
clip_batch_size: 1
dino_view_micro: 2
knn_chunk: 512
num_workers: 4
use_amp: true
banks_on_gpu: true
coreset_on_gpu: true
device: "cuda"
seed: 42
