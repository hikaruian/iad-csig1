# Default configuration for CSIG / Real-IAD Variety challenge
# -------------------------------------------------------------
# Reproduces the primary submission.
# Tuned for a SINGLE 16 GB GPU (RTX 3090/4080/A100-16G).
# If you have >=24 GB, use configs/champion.yaml instead.
# If you have <=12 GB, use configs/lowmem.yaml.
#
# Memory budget breakdown (fp16 AMP, lazy banks, batched FPS):
#   DINOv2-L weights       ~600 MB
#   CLIP ViT-L/14 weights  ~800 MB
#   Activations (micro=2)  ~1.5 GB peak
#   Single-class coreset   ~64 MB
#   Buffers / TTA / maps   ~200 MB
#   ----------------------------
#   TOTAL                  ~3.2 GB per GPU
#
# Expected runtime: ~3-5 minutes on 1x RTX 3090 at 448px with 50 classes
# (coreset build was the former bottleneck; now ~5-10s on GPU via batched FPS).

train_root: "CSIG/Train"
test_root:  "CSIG/Test_A"
out_dir:    "submission"

dinov2_model: "vitl14"
dinov2_layers: [8, 9, 10, 11]
input_size: 448             # must be divisible by 14 (DINO patch size)

use_clip: true
clip_model: "ViT-L-14-336"
clip_pretrained: "openai"

# --- PatchCore++ ---
coreset_ratio: 0.02
coreset_max: 16384
neighbourhood_size: 3
n_neighbours: 5
smooth_kernel: 9
smooth_sigma: 4.0
cls_bank_weight: 0.25
# Coreset build speed knobs (see MEMORY_OPTIMIZATIONS.md for details):
coreset_batch: 64           # points picked per FPS matmul; 64 = ~100x faster than naive
coreset_presample_ratio: 3.0  # random pre-subsample multiplier before FPS
random_proj_dim: 256        # sparse RP dimension for distance calculations

# --- Multi-view ---
mv_aggregate: "robust_mean"
mv_vote_beta: 1.5
use_mv_attn: false          # unused in default scoring; saves ~16 MB

# --- TTA ---
use_tta: true
tta_weight_orig: 1.0
tta_weight_flip: 0.5

# --- Ensemble ---
ens_dino_weight: 0.75
ens_clip_weight: 0.25

# --- Memory / precision ---
batch_size: 2               # DINO train batch size
clip_batch_size: 1          # CLIP forward micro-batch
dino_view_micro: 2          # max views per DINO micro-batch at inference
knn_chunk: 512              # query chunk for kNN matmul
num_workers: 4
use_amp: true               # fp16 autocast (~halves VRAM)
banks_on_gpu: false         # lazy per-class bank migration (~64 MB vs ~3.2 GB)
coreset_on_gpu: true        # run coreset selection on GPU (fast, ~30 MB temp)
raw_store_fp16: true        # store raw train features in fp16 (halves CPU RAM)
device: "cuda"
seed: 42
