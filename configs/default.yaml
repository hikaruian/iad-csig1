# Default configuration for CSIG / Real-IAD Variety challenge
# ------------------------------------------------------------
# PIXEL-AP OPTIMISED defaults (v2). Key changes vs the earlier paplus round:
#   * DINOv2 last-block CLS-attention FOREGROUND MASK (free) to suppress
#     background/jig/conveyor false positives.
#   * HARD-NEGATIVE NORMAL MINING: append high-self-distance training
#     patches back to each class bank (kills FPs on textured edges).
#   * CONNECTED-COMPONENT size suppression (pure-PyTorch, no scipy) for
#     salt-and-pepper noise.
#   * Raised dino_map_lo_q (0.50 -> 0.70) so background maps closer to 0.
#   * Lighter Gaussian (k=7 sigma=2.0) and gamma=2.0.
#   * Slightly lower CLIP weight (0.20) so WinCLIP noise doesn't dilute P-AP.
#
# Expected peak GPU memory: ~3.5 GB per GPU.
# Expected runtime: ~5-8 minutes on 2x RTX 3090 (due to extra CC cleanup
# and the hard-negative mining pass over training features).
#
# Metrics on Test_A (paplus baseline -> v2 expected):
#   paplus : score=65.58 I-AUROC=0.879 I-AP=0.934 P-AUROC=0.925 P-AP=0.296 P-F1=0.425
#   default (v2): I-AUROC>=0.88, P-AP>=0.32, score>=68
# For best P-AP use configs/paplus2.yaml.

train_root: "CSIG/Train"
test_root:  "CSIG/Test_A"
out_dir:    "submission"

dinov2_model: "vitl14"
dinov2_layers: [8, 9, 10, 11]
input_size: 448

use_clip: true
clip_model: "ViT-L-14-336"
clip_pretrained: "openai"
clip_mask_ens: false

# --- PatchCore++ ---------------------------------------------------------
coreset_ratio: 0.025
coreset_max: 20480
neighbourhood_size: 1
n_neighbours: 1
smooth_kernel: 7
smooth_sigma: 2.0
cls_bank_weight: 0.20
coreset_batch: 64
coreset_presample_ratio: 3.0
random_proj_dim: 256

# --- Hard-negative mining ------------------------------------------------
hard_negative_k: 1536

# --- Foreground ----------------------------------------------------------
use_foreground_mask: true
fg_percentile: 35.0
fg_bg_floor: 0.15
fg_smooth_sigma: 2.0

# --- Connected-component cleanup ----------------------------------------
cc_min_area: 25
cc_threshold: 0.30
cc_kill_factor: 0.10

# --- Multi-view ----------------------------------------------------------
mv_aggregate: "robust_mean"
mv_vote_beta: 1.5
use_mv_attn: false
mv_mask_vote: "none"

# --- TTA -----------------------------------------------------------------
use_tta: true
tta_weight_orig: 1.0
tta_weight_flip: 0.5

# --- Ensemble ------------------------------------------------------------
ens_dino_weight: 1.0
ens_clip_weight: 0.20

# --- Calibration percentiles --------------------------------------------
dino_map_lo_q: 0.70
dino_map_hi_q: 0.998
dino_img_lo_q: 0.05
dino_img_hi_q: 0.95

# --- Final mask gamma ----------------------------------------------------
mask_gamma: 2.0

# --- Runtime / memory ----------------------------------------------------
batch_size: 2
clip_batch_size: 1
dino_view_micro: 2
knn_chunk: 512
num_workers: 4
use_amp: true
banks_on_gpu: false
coreset_on_gpu: true
device: "cuda"
seed: 42
