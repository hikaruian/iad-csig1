# Default configuration for CSIG / Real-IAD Variety challenge
# -------------------------------------------------------------
# Reproduces the primary submission.
# Tuned for a SINGLE 16 GB GPU (RTX 3090/4080/A100-16G).
# If you have ≥24 GB, use configs/champion.yaml instead.
#
# Expected runtime: ~90 min on 1× RTX 3090 at 448px with 50 classes.

train_root: "CSIG/Train"
test_root:  "CSIG/Test_A"
out_dir:    "submission"

dinov2_model: "vitl14"
dinov2_layers: [8, 9, 10, 11]
input_size: 448             # must be divisible by 14 (DINO patch size)

use_clip: true
clip_model: "ViT-L-14-336"
clip_pretrained: "openai"

# --- PatchCore++ ---
coreset_ratio: 0.02
coreset_max: 16384
neighbourhood_size: 3
n_neighbours: 5
smooth_kernel: 9
smooth_sigma: 4.0
cls_bank_weight: 0.25

# --- Multi-view ---
mv_aggregate: "robust_mean"
mv_vote_beta: 1.5
use_mv_attn: true

# --- TTA ---
use_tta: true
tta_weight_orig: 1.0
tta_weight_flip: 0.5

# --- Ensemble ---
ens_dino_weight: 0.75
ens_clip_weight: 0.25

# --- Memory / precision (NEW) ---
batch_size: 2              # DINO batch size; 2 is safe for 16 GB GPUs
clip_batch_size: 1         # CLIP batch size (ViT-L@448 uses ~1.3 GB/view in fp16)
num_workers: 8
use_amp: true              # fp16 autocast for backbone forwards (~halves VRAM)
device: "cuda"
seed: 42
