# =============================================================================
# DINOv2 + DINOv3 ensemble config (高级配置，需要少量手动接入)
# =============================================================================
# 说明：本配置中的 use_dinov3 / dinov3_variant / dinov3_layers / dinov3_weight
# **不会被当前 pipeline.py 自动识别**。你需要在 pipeline.py 中额外实例化
# DINOv3FeatureExtractor、抽取 patch 特征、在 patch 维度与 DINOv2 map 做加权
# 平均（或 channel-cat 后再经过投影层）后送入 PatchCore。这是一个留给高级用户
# 的集成接口，预期 +1~2pp P-AUPR。
#
# 基础字段（已由默认 pipeline 支持）：
#   dinov2_model, dinov2_layers, input_size, use_clip, clip_model, clip_pretrained,
#   coreset_ratio, coreset_max, n_neighbours, smooth_sigma, cls_bank_weight,
#   mv_aggregate, mv_vote_beta, use_mv_attn, use_tta, ens_dino_weight, ens_clip_weight,
#   batch_size, num_workers, device, seed
# 如果不接入 DINOv3，请使用 default.yaml 或 champion.yaml。
# =============================================================================

# ---- primary backbone (DINOv2) ----
dinov2_model: "vitl14"
dinov2_layers: [8, 9, 10, 11]

# ---- secondary DINOv3 branch (需要手动接入) ----
use_dinov3: true
dinov3_variant: "l16_493"
dinov3_layers: [18, 19, 20, 21, 22, 23]
dinov3_weight: 0.4

input_size: 448

use_clip: true
clip_model: "ViT-L-14-336"
clip_pretrained: "openai"

coreset_ratio: 0.02
coreset_max: 16384
neighbourhood_size: 3
n_neighbours: 5
smooth_kernel: 9
smooth_sigma: 4.0
cls_bank_weight: 0.25

mv_aggregate: "robust_mean"
mv_vote_beta: 1.5
use_mv_attn: true

use_tta: true
tta_weight_orig: 1.0
tta_weight_flip: 0.5

ens_dino_weight: 0.75
ens_clip_weight: 0.25

batch_size: 2
clip_batch_size: 1
num_workers: 8
use_amp: true
device: "cuda"
seed: 42
