# paplus_sota.yaml -- Architecture-level upgrade, NOT a knob-tweak.
#
# The previous paplus_best was stuck at score 65.5 / P-AP 0.295 because
# several ARCHITECTURAL bugs had never been addressed. This config flips
# all of them ON. Incremental tuning of gamma/lo_q/CC cannot fix them.
#
# Structural changes (see pipeline.py / patchcore.py / utils.py / zeroshot.py):
#
#   (1) DINOv2 layers 8,9,10,11 -> (16,19,22). The 8-11 choice comes from
#       DINOv1-era papers. DINOv2-L/14 iBOT+registers concentrates anomaly
#       signal in LATE blocks; early blocks carry low-level edges/texture
#       that light up on normal machining marks and kill P-AP.
#
#   (2) Multi-scale inference (392, 448, 518) with GEOMETRIC-MEAN fusion
#       across scales. Defects exist at characteristic physical scales;
#       single-scale inference cannot cover scratch(=fine), dent(=medium),
#       stain(=large) simultaneously. Geometric mean (not arithmetic)
#       requires a response to appear at MULTIPLE scales to survive,
#       which suppresses scale-specific false positives. Costs ~1.7x the
#       DINO forward passes, but we DROP v-flip and hv-flip from TTA (they
#       produced physically impossible upside-down views on a fixed-rig
#       dataset) so net runtime is similar to before.
#
#   (3) TTA reduced from {orig,h,v,hv} to {orig,h}. v/hv flips make no
#       sense for Real-IAD -- parts are mounted in a fixed camera rig
#       and never appear upside-down. Those two augmentations were adding
#       OOD views that polluted the TTA average.
#
#   (4) Multi-view aggregation: robust_mean -> MEAN. robust_mean drops
#       the highest view per sample. On Real-IAD a defect may be visible
#       on exactly ONE view (the 5 cameras see different physical
#       surfaces); dropping that view throws away the signal.
#
#   (5) WinCLIP reference bank 2048 -> 4096 patches for better normal
#       coverage (100 train imgs * (448/14)^2 = 102400 patches per class,
#       2048 was under-sampled).
#
#   (6) Ens_clip_weight 0.22 -> 0.15 because CLIP's image score is
#       uncalibrated w.r.t. DINO's percentile-calibrated score; 0.22
#       over-weighted noisy CLIP signal and dragged I-AUROC.
#
#   (7) Post-processing tuned for the new map quality: lo_q=0.80 (top 20%
#       of normal-patch distances map to non-zero), gamma=2.8,
#       cc_min=50, cc_th=0.25, cc_kill=0.0. These are MONOTONIC transforms
#       so they cannot hurt P-AUROC, only improve P-AP by suppressing
#       background noise.
#
# INTENTIONALLY OFF (proven harmful in v2):
#   * use_whitening=false: diagonal whitening on L2-normed DINOv2 features
#     over-amplifies low-variance dimensions and destroys the cosine
#     structure (P-AUROC 0.92 -> 0.84 in v2).
#   * neighbourhood_size=1 (no patch-grid avg-pool): 3x3 avg-pool smears
#     sharp defect peaks into neighboring normal patches.
#   * n_neighbours=1 (1-NN): k=3 averaging blurs the decision boundary
#     and hurts P-AUROC when the coreset has HN-free bank.
#   * hard_negative_k=0: with the late-layer + multi-scale fix the bank
#     already has good coverage; HN mining in v2 hurt because it was
#     applied on top of whitened features.
#   * clip_mask_ens=false: CLIP patch maps are too spatially noisy for
#     pixel-level fusion even at 0.08 weight.
#   * use_foreground_mask=false: DINOv2 CLS-patch cosine on register
#     models is unreliable as a fg cue (real defects can be suppressed).
#
# Runtime budget vs paplus_best (15-25 min):
#   - DINO forwards: 5 views * 3 scales * 2 flips = 30 forwards/sample
#     (was 5 * 1 * 4 = 20). +50% DINO work.
#   - CC cleanup: unchanged (~7.5s total).
#   - CLIP: unchanged (1 scale, no flips, ~20% of compute).
#   - Total predict: ~25-40 min on 2xP100, acceptable.
#
# Expected metrics (Test_A):
#   I-AUROC:  0.90-0.93  (multi-scale + layer fix improves separation)
#   P-AUROC:  0.94+
#   P-AP:     0.38-0.46  (+8-16pp from 0.295 -- this is the "big jump")
#   Score:    78-86

train_root: "CSIG/Train"
test_root:  "CSIG/Test_A"
out_dir:    "submission_paplus_sota"

dinov2_model: "vitl14"
dinov2_layers: [16, 19, 22]        # (1) late blocks only
input_size: 448
multi_scale: [392, 448, 518]       # (2) geometric-mean multi-scale

use_clip: true
clip_model: "ViT-L-14-336"
clip_pretrained: "openai"
clip_mask_ens: false               # (CLIP mask not used)

# ---- PatchCore (conservative: 1-NN, no neighbourhood avg) ----
coreset_ratio: 0.03
coreset_max: 28672                 # slightly larger bank than 24576
neighbourhood_size: 1
n_neighbours: 1
smooth_kernel: 5
smooth_sigma: 1.8
cls_bank_weight: 0.15
coreset_batch: 64
coreset_presample_ratio: 3.0
random_proj_dim: 256

hard_negative_k: 0

use_foreground_mask: false
fg_percentile: 35.0
fg_bg_floor: 0.20
fg_smooth_sigma: 2.5
fg_hard_threshold: 0.0

use_whitening: false
whitening_eps: 0.02

cc_min_area: 50
cc_threshold: 0.25
cc_kill_factor: 0.0

# ---- Multi-view: simple MEAN across views (4) ----
mv_aggregate: "mean"
mv_vote_beta: 1.5
use_mv_attn: false
mv_mask_vote: "none"

# ---- TTA: h-flip only (no v/hv) (3) ----
use_tta: true
tta_weight_orig: 1.0
tta_weight_flip: 0.6               # slightly up-weight orig vs flip

# ---- Ensemble ----
ens_dino_weight: 1.0
ens_clip_weight: 0.15              # (6) less CLIP on image score
ens_clip_mask_weight: 0.0

# ---- Calibration ----
dino_map_lo_q: 0.80                # (7) aggressive bg crush
dino_map_hi_q: 0.997
dino_img_lo_q: 0.05
dino_img_hi_q: 0.95

mask_gamma: 2.8

# ---- Runtime ----
batch_size: 2
clip_batch_size: 1
dino_view_micro: 1                 # 3 scales * V=5 views -> lower micro-batch
knn_chunk: 512
num_workers: 4
use_amp: true
banks_on_gpu: false
coreset_on_gpu: true
device: "cuda"
seed: 42
