# paplus_ultimate.yaml -- Final shot. Builds on the accumulated evidence:
#
#   * paplus_best (baseline):                  P-AUROC=0.9236 P-AP=0.2954 score=65.5
#   * sota (late+ms_geo+hflip):                P-AUROC=0.9408 P-AP=0.2794 score=65.5
#   * sotav2 (+fg hard kill):                  P-AUROC=0.9439 P-AP=0.2799 score=65.6  (fg useless)
#   * final (dense bank 10% k=3 ms_arith):     P-AUROC=0.9523 P-AP=0.2804 score=65.5
#
# Key lesson: the underlying PIXEL RANKING keeps improving (P-AUROC up +2.9pp
# across these ablations!) but P-AP stays flat because bright FALSE POSITIVE
# BLOBS on object surface texture always sit at the top of the ranked list
# and dominate the precision integral. Post-processing (gamma/CC/fg) cannot
# remove them because they are real high-distance regions in feature space,
# just semantically normal (machining marks, texture edges, normal surface
# variation).
#
# The fix that finally addresses this is IMAGE-LEVEL GATING of the mask:
# multiply the per-pixel calibrated map by a soft scalar derived from the
# image-level calibrated score, so that:
#   - globally-normal images (img_score < 0.2) get their mask multiplied by
#     ~0.15 (essentially kills all FPs on images the model thinks are normal)
#   - globally-anomalous images (img_score > 0.7) get their mask multiplied
#     by ~1.0 (trust localisation fully)
# This is mathematically monotonic in img_score, costs ONE scalar multiply
# per sample, and is widely used in winning AD solutions (it is essentially
# the "image-conditioned segmentation" trick from WinCLIP/APRIL-GAP).
#
# Structural choices retained from final (the ones that improved P-AUROC):
#   - DINOv2 layers [11, 14, 17, 20]  (balanced late-mid texture+semantic)
#   - Multi-scale [336, 448, 504] with ARITHMETIC mean, weights [0.25, 0.5, 0.25]
#     (3 scales; 336 for fine scratches, 448 native, 504 for large defects;
#      arithmetic because geometric killed scale-specific defects)
#   - coreset_ratio=0.10, coreset_max=49152 -> ~10k patches/class dense bank
#   - n_neighbours=3 (3-NN averaging reduces single-vector noise)
#   - TTA: full 4-way flip (orig/h/v/hv) with equal weights
#   - mv_aggregate=mean (don't drop the single defect-bearing view)
#
# Post-processing tuned for this regime:
#   - lo_q=0.75 (moderate bg crush; dense bank tightens background dist)
#   - gamma=2.5 (less aggressive than 3.2 -- map is cleaner already)
#   - CC: threshold 0.50, min_area 60, kill 0.0 (kill BRIGHT small blobs)
#   - CLS gate: enabled by default in code; no config flag needed.
#
# Expected: P-AUROC 0.95+, P-AP 0.38-0.48, score 78-88.
# Runtime: 35-60 min on 2xP100 (still within Kaggle limits).

train_root: "CSIG/Train"
test_root:  "CSIG/Test_A"
out_dir:    "submission_paplus_ultimate"

dinov2_model: "vitl14"
dinov2_layers: [11, 14, 17, 20]
input_size: 448
multi_scale: [336, 448, 504]
multi_scale_weights: [0.25, 0.5, 0.25]

use_clip: true
clip_model: "ViT-L-14-336"
clip_pretrained: "openai"
clip_mask_ens: false

coreset_ratio: 0.10
coreset_max: 49152
neighbourhood_size: 1
n_neighbours: 3
smooth_kernel: 5
smooth_sigma: 1.6
cls_bank_weight: 0.12
coreset_batch: 64
coreset_presample_ratio: 2.0
random_proj_dim: 256

hard_negative_k: 0

use_foreground_mask: false
fg_percentile: 35.0
fg_bg_floor: 0.20
fg_smooth_sigma: 2.5
fg_hard_threshold: 0.0

use_whitening: false
whitening_eps: 0.02

cc_min_area: 60
cc_threshold: 0.50
cc_kill_factor: 0.0

mv_aggregate: "mean"
mv_vote_beta: 1.5
use_mv_attn: false
mv_mask_vote: "none"

use_tta: true
tta_weight_orig: 1.0
tta_weight_flip: 0.5

ens_dino_weight: 1.0
ens_clip_weight: 0.12
ens_clip_mask_weight: 0.0

dino_map_lo_q: 0.75
dino_map_hi_q: 0.997
dino_img_lo_q: 0.05
dino_img_hi_q: 0.95

mask_gamma: 2.5

batch_size: 2
clip_batch_size: 1
dino_view_micro: 1
knn_chunk: 256
num_workers: 4
use_amp: true
banks_on_gpu: false
coreset_on_gpu: true
device: "cuda"
seed: 42
