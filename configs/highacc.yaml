# Highest-accuracy config (slower, needs ~32GB GPU).
# Use DINOv2-G/14 with multi-scale input (448 + 630) averaged and a bigger
# memory bank, plus stronger CLIP ensemble.
dinov2_model: "vitg14"
dinov2_layers: [16, 20, 22, 23, 24, 27, 31, 35, 39]   # last 9 blocks of ViT-G/40
input_size: 518           # 518 / 14 = 37, integer grid

use_clip: true
clip_model: "ViT-L-14-336"
clip_pretrained: "openai"

coreset_ratio: 0.05
coreset_max: 32768
neighbourhood_size: 3
n_neighbours: 9
smooth_kernel: 11
smooth_sigma: 5.0
cls_bank_weight: 0.3

mv_aggregate: "robust_mean"
mv_vote_beta: 2.0
use_mv_attn: true

use_tta: true
tta_weight_orig: 1.0
tta_weight_flip: 0.6

ens_dino_weight: 0.7
ens_clip_weight: 0.3

batch_size: 2
num_workers: 8
device: "cuda"
seed: 42
