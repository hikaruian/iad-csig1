# Quick / low-memory ablation config.
# DINOv2-B/14 only, no CLIP, smaller coreset. Good for a sanity run on an
# 8 GB GPU or for fast iteration (~20 min). Expected ~1-2% below champion.

dinov2_model: "vitb14"
dinov2_layers: [8, 9, 10, 11]
input_size: 448

use_clip: false

coreset_ratio: 0.01
coreset_max: 8192
neighbourhood_size: 3
n_neighbours: 3
smooth_kernel: 7
smooth_sigma: 3.0
cls_bank_weight: 0.25
coreset_batch: 64
coreset_presample_ratio: 3.0
random_proj_dim: 256

mv_aggregate: "robust_mean"
mv_vote_beta: 1.5
use_mv_attn: false

use_tta: true
tta_weight_orig: 1.0
tta_weight_flip: 0.5

ens_dino_weight: 1.0
ens_clip_weight: 0.0

# --- Memory / precision ---
batch_size: 4
clip_batch_size: 1
dino_view_micro: 4
knn_chunk: 1024
num_workers: 4
use_amp: true
banks_on_gpu: true
coreset_on_gpu: true
raw_store_fp16: true
device: "cuda"
seed: 42
