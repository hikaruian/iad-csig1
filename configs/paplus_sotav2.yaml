# paplus_sotav2.yaml -- Builds on paplus_sota (P-AUROC 0.941 proved the
# architecture is better; P-AP dropped to 0.279 because late-layer +
# multi-scale features produce bright false-positive blobs on object
# silhouette edges and texture discontinuities that CC at threshold 0.25
# cannot kill).
#
# Key insight from the sota run:
#   P-AUROC 0.924 -> 0.941  means the underlying RANKING of pixels got
#   BETTER (true defects are scored higher than ever), so we do NOT revert
#   the late-layer / multi-scale / h-flip-only / mean-aggregation changes.
#   The P-AP drop is purely a HIGH-PRECISION-REGIME problem: a small number
#   of very bright FP blobs (object edges, multi-scale seam artifacts)
#   dominate the top of the ranked list and murder precision at every
#   operating threshold. We fix this with FREE post-processing that
#   CANNOT hurt ranking of true defects:
#
#   (A) TURN ON FOREGROUND HARD THRESHOLD (the big gun).
#       fg_hard_threshold: 0.20 -- pixels whose CLS<->patch final-norm
#       cosine saliency is below 0.20 are HARD-ZEROED. In any real
#       industrial image, this region is the physical background (table,
#       fixture, backdrop) where defects cannot exist. We already proved in
#       paplus2fix that soft fg alone was absorbed by calibrator and did
#       nothing; now fg is applied AFTER cc/gamma/calibration so the zero
#       is final. 0.20 is conservative -- real object surface pixels have
#       fg saliency 0.4-0.9 on DINOv2-L. This kills silhouette-edge FPs
#       and backdrop FPs in one shot.
#
#   (B) Stronger CC with a HIGHER threshold. cc_threshold 0.25 -> 0.45.
#       After percentile calibration to lo_q=0.80, the bulk of background
#       noise lives below 0.3; the blob FPs we are killing are bright
#       (>0.45) and small (<80 px). A low threshold misses the blobs we
#       actually need to cut. At 0.45 we see them; cc_min_area=80 then
#       kills them. cc_kill_factor=0.0 hard-zeroes them (since the
#       threshold is high we are very unlikely to hit real defects --
#       industrial defects at 448 px are well over 100 px).
#
#   (C) Lower lo_q back to 0.70. 0.80 was tuned for paplus_best's
#       noisier single-scale maps; with multi-scale geometric mean the
#       background distribution is tighter and 0.80 clips the tail of
#       weak defect responses. 0.70 is the sweet spot where weak FPs
#       still sit near 0.1-0.2 while real defects stay high.
#
#   (D) Raise gamma to 3.2. Gamma is monotonic (cannot hurt AUROC) and
#       further squashes mid-tone FPs (0.2-0.5) that survived lo_q.
#
# NOT touched (proven in sota):
#   * dinov2_layers=(16,19,22), multi_scale=(392,448,518) -- these gave
#     the +1.7pp P-AUROC gain, the single biggest structural improvement.
#   * TTA = h-flip only, tta_weight_flip=0.6.
#   * mv_aggregate=mean (not robust_mean).
#   * n_neighbours=1, neighbourhood_size=1 (no blur).
#   * whitening=OFF, HN=0, clip_mask=OFF.
#   * coreset_max=28672, cls_bank_weight=0.15, ens_clip_weight=0.15.
#
# Expected:
#   P-AUROC: 0.94+ (same or slightly better than sota -- fg is monotonic
#            on bg pixels, cannot worsen ranking)
#   I-AUROC: 0.88+
#   P-AP:    0.36 - 0.44  (+8-14pp from paplus_best, +8-16pp from sota)
#   Score:   76 - 84
#   Runtime: same as sota (~25-40 min).

train_root: "CSIG/Train"
test_root:  "CSIG/Test_A"
out_dir:    "submission_paplus_sotav2"

dinov2_model: "vitl14"
dinov2_layers: [16, 19, 22]
input_size: 448
multi_scale: [392, 448, 518]

use_clip: true
clip_model: "ViT-L-14-336"
clip_pretrained: "openai"
clip_mask_ens: false

coreset_ratio: 0.03
coreset_max: 28672
neighbourhood_size: 1
n_neighbours: 1
smooth_kernel: 5
smooth_sigma: 1.8
cls_bank_weight: 0.15
coreset_batch: 64
coreset_presample_ratio: 3.0
random_proj_dim: 256

hard_negative_k: 0

# ---- FOREGROUND ON with HARD KILL (the main fix for high-score FPs) ----
use_foreground_mask: true
fg_percentile: 30.0                # threshold at 30th percentile of saliency
fg_bg_floor: 0.15                  # soft suppression for low-saliency object edges
fg_smooth_sigma: 3.0
fg_hard_threshold: 0.20            # hard-zero pixels with fg < 0.20 (pure bg)

use_whitening: false
whitening_eps: 0.02

# ---- CC aggressive on BRIGHT small blobs ----
cc_min_area: 80
cc_threshold: 0.45
cc_kill_factor: 0.0

mv_aggregate: "mean"
mv_vote_beta: 1.5
use_mv_attn: false
mv_mask_vote: "none"

use_tta: true
tta_weight_orig: 1.0
tta_weight_flip: 0.6

ens_dino_weight: 1.0
ens_clip_weight: 0.15
ens_clip_mask_weight: 0.0

dino_map_lo_q: 0.70
dino_map_hi_q: 0.997
dino_img_lo_q: 0.05
dino_img_hi_q: 0.95

mask_gamma: 3.2

batch_size: 2
clip_batch_size: 1
dino_view_micro: 1
knn_chunk: 512
num_workers: 4
use_amp: true
banks_on_gpu: false
coreset_on_gpu: true
device: "cuda"
seed: 42
